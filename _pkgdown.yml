url: https://survey160.r-universe.dev/survey160r

reference:
- title: Package
  contents:
  - survey160r-package
- title: Raw data access
  desc: >
    Read campaign results from GCS or a local CSV, and trigger fresh exports via
    the API.
  contents:
  - s160_gcs_init
  - s160_gcs_campaign_results_list
  - s160_gcs_campaign_results_read
  - s160_gcs_campaign_results_files
  - s160_gcs_campaign_results_status
  - s160_read_csv
  - s160_csv_header
  - s160_api_auth
  - s160_api_campaign_results
  - s160_api_campaign_get
  - s160_config
  - s160_datasets
- title: Latency analysis
  desc: >
    Per-campaign recipient-latency reports from a raw campaign CSV, and a safe
    funnel reduction of the result.
  contents:
  - latency_run
  - latency_report
  - latency_funnel
  - latency_build_config
  - latency_validate_config
  - latency_config_hash
  - latency_discover_questions
  - latency_input_columns
- title: Campaign export helpers
  desc: >
    Work directly with a raw campaign export data frame -- decode its timestamp
    columns and view the per-question reached funnel.
  contents:
  - parse_campaign_timestamps
  - question_timestamps
  - question_funnel
- title: Utilities
  desc: >
    Standalone helpers that operate on an in-memory export, independent of any
    Survey160 data source.
  contents:
  - utils_fix_double_utf8
- title: Disposition screening
  desc: >
    Screen a phone sample against the disposition dataset -- which numbers have
    been contacted / completed / refused before -- roll it up to funnel rates,
    follow each number's campaigns in order, and build the dataset from a raw
    campaign CSV.
  contents:
  - disposition_pull
  - disposition_screen
  - disposition_summary
  - disposition_records
  - disposition_funnel
  - disposition_steps
  - disposition_paths
  - disposition_run
  - disposition_input_columns
- title: Completion estimates
  desc: >
    Fit the completion model from the disposition dataset, then estimate a
    planned survey's opt-in and completion rates, the sends a target number of
    completes needs, or each number's chance of completing.
  contents:
  - completion_model_fit
  - completion_estimate
  - completion_sample_size
  - completion_score
- title: Opt-out screening
  desc: >
    Download the current opt-out list and screen a phone sample against it --
    which numbers have opted out -- annotating the sample without dropping rows.
  contents:
  - opt_out_pull
  - opt_out_screen
- title: Campaign metrics
  desc: >
    Download the consolidated per-campaign metrics + recipient-latency
    projection (campaign_all.parquet) from the analytics bucket, read it into
    analysis-ready cells, and roll it up to funnel counts and rates by any
    project dimension.
  contents:
  - campaign_metrics_pull
  - campaign_metrics_records
  - campaign_metrics_summary
  - funnel_rates
- title: Live delivery metrics
  desc: >
    Download the hour-by-hour, fleet-wide live delivery counts (one file per ET day)
    from the analytics bucket and roll them up to daily and cumulative delivery
    error rates by carrier or any other dimension.
  contents:
  - live_metrics_pull
  - live_metrics_records
  - live_metrics_error_rates

articles:
- title: Guides
  navbar: ~
  contents:
  - disposition
  - disposition-paths
  - completion-estimate
  - opt-out
  - campaign-metrics
  - delivery-errors
  - latency
