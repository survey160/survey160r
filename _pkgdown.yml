url: https://survey160.r-universe.dev/survey160r

reference:
- title: Package
  contents:
  - survey160r-package
- title: Raw data access
  desc: >
    Read campaign results from GCS or a local CSV, and trigger fresh exports via
    the API.
  contents:
  - s160_gcs_init
  - s160_gcs_campaign_results_list
  - s160_gcs_campaign_results_read
  - s160_gcs_campaign_results_files
  - s160_gcs_campaign_results_status
  - s160_read_csv
  - s160_csv_header
  - s160_api_auth
  - s160_api_campaign_results
  - s160_api_campaign_get
- title: Latency analysis
  desc: Per-campaign recipient-latency reports from a raw campaign CSV.
  contents:
  - latency_run
  - latency_report
  - latency_build_config
  - latency_validate_config
  - latency_config_hash
  - latency_discover_questions
  - latency_input_columns
- title: Disposition screening
  desc: >
    Screen a phone sample against the disposition dataset -- which numbers have
    been contacted / completed / refused before -- and build that dataset from a
    raw campaign CSV.
  contents:
  - disposition_pull
  - disposition_screen
  - disposition_summary
  - disposition_records
  - disposition_run
  - disposition_input_columns
- title: Opt-out screening
  desc: >
    Download the current opt-out list and screen a phone sample against it --
    which numbers have opted out -- annotating the sample without dropping rows.
  contents:
  - opt_out_pull
  - opt_out_screen

